    <!-- Defensive Polyfill & Extension Interceptor Handler -->
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined' && window.fetch) {
            var originalFetch = window.fetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return originalFetch;
              },
              set: function(newFetch) {
                originalFetch = newFetch;
              }
            });
          }
        } catch (e) {
          // ignore
        }

        // Suppress unhandled errors injected by third-party browser extensions
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('Cannot set property fetch of #<Window>') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            String(event.reason).indexOf('Cannot set property fetch of #<Window>') !== -1
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
